<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Reply Assistant</title>
    <script type="module" src="/src/popup/main.ts"></script>
  </head>
  <body>
    <main class="popup">
      <div class="badge">Private MVP</div>
      <h1>X Reply Assistant</h1>
      <p>
        Draft high-quality replies for X posts and for replies people leave on your posts.
      </p>

      <section class="status" id="status">Checking settings...</section>

      <div class="actions">
        <button id="open-options" type="button">Open settings</button>
        <a href="https://x.com" target="_blank" rel="noreferrer">Open X</a>
      </div>

      <p class="hint">
        On X, click <strong>AI Reply</strong> on a post/reply or <strong>AI Draft</strong> inside a reply composer.
      </p>
    </main>
  </body>
</html>
